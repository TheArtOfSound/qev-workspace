services:
  - type: web
    name: qev-workspace
    runtime: node
    plan: free
    rootDir: .
    buildCommand: corepack enable && corepack prepare pnpm@9.15.0 --activate && pnpm install --frozen-lockfile=false && pnpm run build:relay
    startCommand: pnpm --filter @qev-workspace/relay start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: USE_MOCK_STORAGE
        value: "false"
      - key: MOCK_AUTH_ENABLED
        value: "false"
      # Free plan has no persistent disk; SQLite lives on the instance filesystem and
      # resets on redeploy. Attach a Render disk (or Postgres) for durable storage.
      - key: SQLITE_PATH
        value: .data/qev-workspace.sqlite
      - key: ROOM_TTL_MS
        value: "300000"
      - key: ALLOWED_ORIGINS
        value: http://localhost:5173,https://theartofsound.github.io
      - key: WEB_ORIGIN
        value: https://theartofsound.github.io
      - key: JWT_ISSUER
        value: qev-workspace
      - key: JWT_AUDIENCE
        value: qev-workspace-web
      - key: ACCESS_TOKEN_TTL_SECONDS
        value: "900"
      # Generated once by Render when the service is created / blueprint-synced.
      # Prefer replacing with a dashboard-managed secret for long-lived production.
      - key: JWT_SIGNING_SECRET
        generateValue: true
      - key: TURN_URL
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false
