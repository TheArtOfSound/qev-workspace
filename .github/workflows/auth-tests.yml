name: Auth Tests

on:
  pull_request:
    paths:
      - "apps/relay/src/mockAuth.ts"
      - "apps/relay/src/mockRooms.ts"
      - "apps/web/src/App.tsx"
      - "apps/web/src/Login.tsx"
      - "apps/web/src/auth.ts"
      - "apps/web/src/auth.css"
      - "apps/web/src/types.ts"
      - "apps/web/src/__tests__/auth.test.ts"
      - "apps/web/vite.config.ts"
      - "apps/web/package.json"
      - "tests/auth.integration.spec.ts"
      - "tests/rooms.integration.spec.ts"
      - "tests/chat.integration.spec.ts"
      - "tests/voice.integration.spec.ts"
      - "playwright.rooms.config.ts"
      - "package.json"
      - ".github/workflows/auth-tests.yml"
  push:
    branches:
      - "agent/**"
    paths:
      - "apps/relay/src/mockAuth.ts"
      - "apps/relay/src/mockRooms.ts"
      - "apps/web/src/App.tsx"
      - "apps/web/src/Login.tsx"
      - "apps/web/src/auth.ts"
      - "apps/web/src/auth.css"
      - "apps/web/src/types.ts"
      - "apps/web/src/__tests__/auth.test.ts"
      - "apps/web/vite.config.ts"
      - "apps/web/package.json"
      - "tests/auth.integration.spec.ts"
      - "package.json"
      - ".github/workflows/auth-tests.yml"
  workflow_dispatch:

jobs:
  test-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build shared packages
        run: pnpm run build:packages

      - name: Typecheck relay and web
        run: |
          pnpm --filter @qev-workspace/relay typecheck
          pnpm --filter @qev-workspace/web typecheck

      - name: Run auth unit tests
        run: pnpm test:auth

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run auth browser test
        run: pnpm exec playwright test --config playwright.rooms.config.ts tests/auth.integration.spec.ts
