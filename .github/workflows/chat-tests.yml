name: Chat Tests

on:
  pull_request:
  push:
    branches:
      - "agent/**"
      - main
  workflow_dispatch:

jobs:
  test-chat:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --experimental-sqlite
      USE_MOCK_STORAGE: "false"
      JWT_SIGNING_SECRET: ci-jwt-signing-secret-at-least-32-chars
      SQLITE_PATH: .data/ci-chat.sqlite

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm run build:packages
      - run: pnpm --filter @qev-workspace/relay typecheck
      - name: Mock-storage chat unit tests
        run: USE_MOCK_STORAGE=true pnpm --filter @qev-workspace/relay test:chat
      - name: Durable auth/room/chat integration tests
        run: pnpm --filter @qev-workspace/relay test:auth
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test --config playwright.rooms.config.ts tests/chat.integration.spec.ts tests/rooms.integration.spec.ts
