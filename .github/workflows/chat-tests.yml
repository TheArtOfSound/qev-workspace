name: Chat Tests

on:
  pull_request:
    paths:
      - "apps/relay/src/mockChat.ts"
      - "apps/relay/src/mockChat.test.ts"
      - "apps/relay/src/mockRooms.ts"
      - "apps/relay/src/server.ts"
      - "apps/relay/package.json"
      - "apps/web/src/ChatBox.tsx"
      - "apps/web/src/RoomView.tsx"
      - "apps/web/src/chat.ts"
      - "apps/web/src/rooms.ts"
      - "apps/web/src/rooms.css"
      - "apps/web/src/types.ts"
      - "tests/chat.integration.spec.ts"
      - "playwright.rooms.config.ts"
      - "package.json"
      - ".github/workflows/chat-tests.yml"
  workflow_dispatch:

jobs:
  test-chat:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build shared packages
        run: pnpm run build:packages

      - name: Typecheck relay and web
        run: |
          pnpm --filter @qev-workspace/relay typecheck
          pnpm --filter @qev-workspace/web typecheck

      - name: Run relay chat unit tests
        run: pnpm --filter @qev-workspace/relay test:chat

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run chat UI test
        run: pnpm exec playwright test --config playwright.rooms.config.ts tests/chat.integration.spec.ts
