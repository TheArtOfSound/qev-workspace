name: Deploy Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: "true"
      # Prefer repo variables when set. Defaults target the live Cloudflare-tunneled API
      # (Render free auto-deploy is not currently refreshing this service).
      VITE_RELAY_URL: ${{ vars.VITE_RELAY_URL || 'wss://qev-api.autohustle.online/ws' }}
      VITE_API_URL: ${{ vars.VITE_API_URL || 'https://qev-api.autohustle.online' }}
      VITE_AUTH_API_URL: ${{ vars.VITE_AUTH_API_URL || 'https://qev-api.autohustle.online' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm run build:packages
      - run: pnpm --filter @qev-workspace/web typecheck
      - run: pnpm run build:web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
