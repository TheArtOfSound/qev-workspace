name: Web Build

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: "true"
      VITE_RELAY_URL: "wss://qev-api.autohustle.online/ws"
      VITE_API_URL: "https://qev-api.autohustle.online"
      VITE_AUTH_API_URL: "https://qev-api.autohustle.online"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm run build:packages
      - run: pnpm --filter @qev-workspace/relay typecheck
      - run: pnpm --filter @qev-workspace/web typecheck
      - run: pnpm run build:web
